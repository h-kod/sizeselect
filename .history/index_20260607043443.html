<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shoe Size Widget Demo</title>
  </head>
  <body>
    <main style="padding:24px; max-width:820px; margin:0 auto;">
      <h1>Modern Sneaker</h1>
      <p>Brand: Nike</p>
      <img src="https://via.placeholder.com/420x240?text=Modern+Sneaker" alt="product" />

      <div style="margin-top:16px">
        <label for="size-select">Size</label>
        <select id="size-select" name="size">
          <option>40</option>
          <option>41</option>
          <option>42</option>
          <option>42.5</option>
          <option>43</option>
          <option>44</option>
        </select>
        <!-- fallback link will be inserted near this select by the embed script -->
      </div>
    </main>

    <script type="module" src="/src/widget/embed.ts" data-brand="Nike" data-product-category="sneaker" data-position="after-size-selector"></script>
  </body>
</html>
