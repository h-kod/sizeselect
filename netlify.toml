[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "npm run dev"

# Widget üçüncü taraf sitelerden yüklendiği için CORS açık olmalı.
[[headers]]
  for = "/shoe-size-widget.js"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=300, must-revalidate"

[[redirects]]
  from = "/tr"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/tr/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/en"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/en/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/panel"
  to = "/dashboard.html"
  status = 200
